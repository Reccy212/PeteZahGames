services:
  - type: web
    name: petezahgames
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: TOKEN_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_ORIGIN
        sync: false
      - key: GROQ_API_KEY
        sync: false
